<section class="page-section anotacoes-page" *ngIf="vm$ | async as vm">
  <div class="anotacoes-layout">
    <article class="card anotacoes-list-card">
      <div class="card-title-row">
        <div>
          <h3 class="card-title">Lista de anotações</h3>
          <p class="card-subtitle">Selecione uma anotação para continuar a edição.</p>
        </div>
        <div class="anotacoes-hero-actions">
          <span class="status-chip">Total: {{ vm.total }}</span>
          <button class="btn primary" type="button" (click)="abrirNovaAnotacao()">Nova anotação</button>
        </div>
      </div>

      <label class="anotacoes-search-field">
        <input
          name="buscarAnotacaoTitulo"
          type="text"
          [ngModel]="filtroTitulo"
          (ngModelChange)="atualizarFiltroTitulo($event)"
          placeholder="Buscar anotação por título..."
          autocomplete="off"
        />
      </label>

      <div class="empty-state" *ngIf="!!vm.erro">{{ vm.erro }}</div>
      <div class="skeleton anotacoes-skeleton" *ngIf="vm.carregando && vm.total === 0"></div>

      <div class="anotacoes-list" *ngIf="!vm.erro && (!vm.carregando || vm.total > 0)">
        <div class="empty-state" *ngIf="vm.total === 0">Nenhuma anotação salva.</div>

        <div class="empty-state" *ngIf="vm.total > 0 && vm.totalFiltrado === 0">
          Nenhuma anotação encontrada
        </div>

        <button
          class="anotacao-item"
          type="button"
          *ngFor="let item of vm.anotacoes; trackBy: trackByAnotacao"
          [class.selected]="item.id === anotacaoSelecionadaId"
          (click)="selecionarAnotacao(item)"
        >
          <span class="anotacao-item-title">{{ item.titulo || 'Sem título' }}</span>
          <span class="anotacao-item-date" *ngIf="item.dataLabel">{{ item.dataLabel }}</span>
        </button>
      </div>
    </article>

    <article class="card anotacoes-editor-card">
      <div class="card-title-row anotacoes-editor-header">
        <div>
          <h3 class="card-title">Editor</h3>
          <p class="card-subtitle">CKEditor 5 com seleção parcial, listas, cores e fonte.</p>
        </div>
        <div class="anotacoes-editor-header-actions">
          <span class="status-chip neutral">{{ getStatusLabel() }}</span>
          <button class="btn secondary" type="button" (click)="abrirNovaAnotacao()">
            Nova anotação
          </button>
        </div>
      </div>

      <form class="form anotacoes-form" (ngSubmit)="salvarAnotacao()">
        <div class="anotacoes-form-body">
          <label>
            <span>Título</span>
            <input
              name="tituloAnotacao"
              type="text"
              [(ngModel)]="titulo"
              placeholder="Digite um título"
              required
            />
          </label>

          <div class="field anotacoes-editor-field">
            <span class="field-label">Conteúdo</span>

            <div class="editor-shell">
              <ckeditor
                *ngIf="editorVisivel"
                class="editor-host"
                name="conteudoAnotacao"
                [editor]="Editor"
                [config]="editorConfig"
                [(ngModel)]="conteudoHtml"
                (ready)="onEditorReady($event)"
                (change)="onEditorChange()"
              ></ckeditor>
            </div>
          </div>
        </div>

        <div class="anotacoes-actions">
          <button
            class="btn primary"
            type="submit"
            [disabled]="salvando || excluindo || vm.carregando"
          >
            {{ getSalvarLabel() }}
          </button>
          <button
            class="btn danger"
            type="button"
            *ngIf="podeExibirExcluir()"
            (click)="excluirAnotacao()"
            [disabled]="excluindo || salvando"
          >
            {{ getExcluirLabel() }}
          </button>
        </div>
      </form>
    </article>
  </div>
</section>
