<section class="page-section sistemas-page" *ngIf="vm$ | async as vm">
  <div class="sistemas-layout" *ngIf="!vm.carregando || vm.total > 0">
    <article class="card sistemas-col sistemas-list-card">
      <div class="card-title-row sistemas-list-header">
        <div>
          <h3 class="card-title">Lista de sistemas</h3>
        </div>
        <div class="sistemas-hero-actions">
          <div class="sistemas-search-total">
            <input
              class="sistemas-search"
              name="buscarSistema"
              type="search"
              aria-label="Pesquisar sistema"
              placeholder="Pesquisar sistema..."
              [ngModel]="filtroSistema"
              (ngModelChange)="atualizarFiltroSistema($event)"
            />
            <span class="status-chip">Total: {{ vm.total }}</span>
          </div>
          <button class="btn primary" type="button" (click)="abrirCadastroSistema()">Novo sistema</button>
        </div>
      </div>

      <div class="empty-state" *ngIf="!!vm.erro">{{ vm.erro }}</div>

      <div class="sistemas-list-scroll" *ngIf="!vm.erro">
        <div class="empty-state" *ngIf="vm.total === 0">
          Nenhum sistema cadastrado.
        </div>
        <div class="empty-state" *ngIf="vm.total > 0 && vm.sistemas.length === 0">
          Nenhum sistema encontrado.
        </div>

        <div class="sistema-item" *ngFor="let item of vm.sistemas; trackBy: trackBySistema">
          <div class="sistema-item-main">
            <div class="sistema-item-name">{{ item.nome }}</div>
            <div class="sistema-item-meta">
              <span class="sistema-item-id-label">ID</span>
              <code class="sistema-item-id">{{ item.id }}</code>
            </div>
          </div>

          <button
            class="btn danger btn-sm"
            type="button"
            (click)="excluirSistema(item)"
            [disabled]="excluindoId === item.id"
          >
            {{ getExcluirLabel(item) }}
          </button>
        </div>
      </div>
    </article>
  </div>

  <div class="skeleton" style="min-height: 280px;" *ngIf="vm.carregando && vm.total === 0"></div>

  <div class="modal" *ngIf="cadastrandoSistema">
    <div class="modal-content sistemas-modal-panel" role="dialog" aria-modal="true" aria-labelledby="cadastroSistemaTitulo">
      <h3 id="cadastroSistemaTitulo">Novo sistema</h3>
      <form class="form" (ngSubmit)="adicionarSistema()">
        <label>
          <span>Nome do sistema</span>
          <input
            name="nomeSistema"
            type="text"
            [(ngModel)]="nome"
            placeholder="Ex: SG8, Transmissor SG8, Office"
            [readOnly]="salvando"
            required
          />
        </label>

        <div class="sistemas-id-preview" *ngIf="getSistemaIdPreview() as id">
          <span class="sistemas-id-preview-label">ID gerado automaticamente</span>
          <code class="sistemas-id-preview-value">{{ id }}</code>
        </div>

        <div class="modal-actions">
          <button class="btn" type="button" (click)="cancelarCadastroSistema()" [disabled]="salvando">
            Cancelar
          </button>
          <button class="btn primary" type="submit" [disabled]="salvando">
            {{ salvando ? "Salvando..." : "Salvar" }}
          </button>
        </div>
      </form>
    </div>
  </div>
</section>
