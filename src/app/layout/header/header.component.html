<header class="topbar">
  <div class="header-left">
    <div>
      <h1>{{ title }}</h1>
    </div>
    <label class="dashboard-year" *ngIf="title === 'Dashboard'">
      <span>Ano</span>
      <select
        aria-label="Ano principal do Dashboard"
        [ngModel]="dashboardFilter.anoSelecionado$ | async"
        (ngModelChange)="dashboardFilter.selecionarAno($event)"
      >
        <option [ngValue]="'__all__'">Todos</option>
        <option *ngFor="let ano of dashboardFilter.anosDisponiveis$ | async" [ngValue]="ano">
          {{ ano }}
        </option>
      </select>
    </label>
  </div>

  <div class="header-right">
    <button
      *ngIf="title === 'Dashboard'"
      class="btn primary dashboard-register"
      type="button"
      aria-label="Registrar concluído"
      title="Registrar concluído"
      (click)="abrirCadastroConcluido()"
    >
      <span class="dashboard-register-icon" aria-hidden="true">+</span>
      <span class="dashboard-register-label">Registrar concluído</span>
    </button>
    <div class="header-user">
      <div class="user-avatar">{{ userInitial }}</div>
      <div class="user-meta">
        <span>Usuário ativo</span>
        <strong>{{ userEmail }}</strong>
      </div>
    </div>
  </div>
</header>

<app-abertos
  *ngIf="title === 'Dashboard'"
  #cadastroConcluido
  [somenteCadastroConcluido]="true"
></app-abertos>
